name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole file against a tagged commit as part of its
  # gate, so whatever this workflow grows into is what a release must pass.
  # A job that is continue-on-error here must not be on a tag — the gate would
  # pass over its failure; guard it with
  # `continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}`.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The floor row: Home Assistant 2026.3.1 requires Python 3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --requirement requirements_test.txt
      # The commands live in the script, never here, so local and CI cannot
      # drift: ruff, ruff format --check, mypy strict, and the layout check.
      # This is one job because there is nothing yet to matrix over. §8.7's
      # two rows — floor blocking, latest continue-on-error on a monthly
      # cron — arrive with the test suite, and take mypy per row with them.
      - run: scripts/check.sh
