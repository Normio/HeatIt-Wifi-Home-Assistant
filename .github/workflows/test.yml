name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The floor row: Home Assistant 2026.3.1 requires Python 3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --requirement requirements_test.txt
      # The commands live in the script, never here, so local and CI cannot
      # drift: ruff, ruff format --check, mypy strict, and the layout check.
      - run: scripts/check.sh
