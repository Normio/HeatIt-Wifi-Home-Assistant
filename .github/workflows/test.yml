name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly: the latest row is the early warning for a Home Assistant
    # release deprecating something we use, and a month without a pull
    # request must still produce that signal.
    - cron: "0 5 2 * *"

permissions:
  contents: read

jobs:
  lint:
    # Row-independent and needs no Home Assistant, so it runs once (§9.3).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The pin lives in requirements_test.txt and nowhere else.
      - run: pip install "$(grep --regexp '^ruff==' requirements_test.txt)"
      - run: scripts/check.sh lint

  tests:
    # Two rows (§8.7). The floor row is what a developer installs locally and
    # blocks a merge; the latest row is a signal, not a blocker.
    name: Tests (${{ matrix.row }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.row == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        row: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.3.1, the declared floor, requires Python 3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --requirement requirements_test.txt
      - if: matrix.row == 'latest'
        # Unpinned: the newest HA release and its Python, on top of the floor
        # install so the linters stay exactly pinned.
        run: pip install --upgrade pytest-homeassistant-custom-component
      # The commands live in the script, never here: mypy strict against
      # this row's Home Assistant, then pytest with coverage reported.
      - run: scripts/check.sh test
