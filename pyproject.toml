# This repository is not a Python package — there is no [project] table and
# nothing is built from it. pyproject.toml exists to configure the linters, so
# that scripts/check.sh and CI read one set of rules.

[tool.ruff]
# Home Assistant 2026.3.1, the declared floor, requires Python 3.14.2.
target-version = "py314"

# `ruff format` reformats Python inside Markdown fences: without this, a run
# rewrites five of the documents under docs/. They quote illustrative
# snippets that are deliberately not the shipped code, and a spec excerpt
# eliding its annotations is not a formatting failure.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing commas are the formatter's business; the rule fights it
  "CPY001", # the MIT LICENSE at the root is the notice; per-file headers are not the HA convention
  "D203",   # mutually exclusive with D211; we take D211, no blank line before a class docstring
  "D213",   # mutually exclusive with D212; we take D212, summary on the first line
  "INP001", # scripts/ holds standalone entry points, deliberately not an importable package
  "ISC001", # implicit string concatenation on one line is what the formatter produces
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and a test's literal is its expected value, not a magic number.
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The scripts are standalone entry points, not a package; tests import them by
# module name from here.
pythonpath = ["scripts"]

[tool.mypy]
python_version = "3.14"
strict = true
