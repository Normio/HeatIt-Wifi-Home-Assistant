# This repository is not a Python package — there is no [project] table and
# nothing is built from it. pyproject.toml exists to configure the linters, so
# that scripts/check.sh and CI read one set of rules.

[tool.ruff]
# Home Assistant 2026.3.1, the declared floor, requires Python 3.14.2.
target-version = "py314"

# `ruff format` reformats Python inside Markdown fences: without this, a run
# rewrites five of the documents under docs/. They quote illustrative
# snippets that are deliberately not the shipped code, and a spec excerpt
# eliding its annotations is not a formatting failure.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing commas are the formatter's business; the rule fights it
  "CPY001", # the MIT LICENSE at the root is the notice; per-file headers are not the HA convention
  "D203",   # mutually exclusive with D211; we take D211, no blank line before a class docstring
  "D213",   # mutually exclusive with D212; we take D212, summary on the first line
  "INP001", # scripts/ holds standalone entry points, deliberately not an importable package
  "ISC001", # implicit string concatenation on one line is what the formatter produces
]

# Per-file ignores only under tests/ (§9.3): a test asserts, and its name is
# its documentation.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is the test idiom
  "D103",    # a test function's name is its docstring
  "PLR2004", # the literal in a test is the expected value, not a magic number
  "PLR0913", # a parametrised test takes one argument per column
  "PLR0917", # as above
]

[tool.mypy]
python_version = "3.14"
strict = true
# custom_components/ is a namespace package (Home Assistant never ships an
# __init__.py there), and scripts/capture_fixtures.py imports the client by its
# full dotted name. Without this, mypy sees api.py under two module names.
explicit_package_bases = true
# ...which makes the base directories explicit too, and scripts/ is one of them:
# without this, scripts/probe.py becomes module ``scripts.probe`` and the
# ``import probe`` in check_conformance.py and the tests stops resolving. The
# pytest equivalent is ``pythonpath`` below.
mypy_path = ["scripts"]

[[tool.mypy.overrides]]
# pytest-homeassistant-custom-component ships no py.typed marker, so mypy
# strict refuses it outright. Its source is annotated, so follow it rather than
# silencing it: ignore_missing_imports would make every MockConfigEntry an Any
# and quietly disarm mypy across the integration tests.
module = ["pytest_homeassistant_custom_component.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# scripts/ is deliberately not a package; the tests import its modules by name.
pythonpath = ["scripts"]
